---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trivy-operator
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.32.1
  url: oci://ghcr.io/aquasecurity/helm-charts/trivy-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  values:
    serviceMonitor:
      enabled: true
    trivy:
      ignoreUnfixed: true
    service:
      headless: false
    operator:
      builtInTrivyServer: true
      # Chart defaults to 10 concurrent scan jobs, which is a lot of burst on a
      # three-node cluster. Completed jobs are also kept forever by default.
      scanJobsConcurrentLimit: 2
      scanJobTTL: 24h
    # Talos does not expose the host filesystem the node collector expects.
    nodeCollector:
      enabled: false
