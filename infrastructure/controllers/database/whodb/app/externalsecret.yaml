---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whodb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: whodb-secret
    template:
      data:
        # WhoDB reads one WHODB_POSTGRES_<n> per pre-configured connection.
        # These are superuser credentials, so the route stays on envoy-internal.
        WHODB_POSTGRES_1: >-
          {"host":"postgres-rw.database.svc.cluster.local",
          "user":"{{ .POSTGRES_SUPER_USER }}",
          "password":"{{ .POSTGRES_SUPER_PASS }}",
          "database":"postgres"}
        # postgres-immich is dormant while immich is commented out of
        # clusters/aeon/apps/personal/kustomization.yaml. Uncomment with it.
        # WHODB_POSTGRES_2: >-
        #   {"host":"postgres-immich-rw.database.svc.cluster.local",
        #   "user":"{{ .POSTGRES_SUPER_USER }}",
        #   "password":"{{ .POSTGRES_SUPER_PASS }}",
        #   "database":"postgres"}
  dataFrom:
    - extract:
        key: cloudnative-pg
