---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whodb
spec:
  dependsOn:
    - name: onepassword-connect-store
      namespace: external-secrets
    - name: cloudnative-pg
      namespace: database
  interval: 1h
  path: ./infrastructure/controllers/database/whodb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
