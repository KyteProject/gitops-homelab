---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 5m
          annotations:
            summary: >-
              Pod {{ $labels.pod }} is taking more than {{ $value }} seconds for a query.
          labels:
            severity: critical

        - alert: BackendsWaiting
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 5m
          annotations:
            summary: >-
              Pod {{ $labels.pod }} has been waiting for longer than {{ $value }} seconds
          labels:
            severity: critical

        - alert: PGDatabase
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 5m
          annotations:
            summary: >-
              Over {{ $value }} transactions from frozen xid on pod {{ $labels.pod }}
          labels:
            severity: critical

        - alert: PGReplication
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 5m
          annotations:
            summary: >-
              Standby is lagging behind by over {{ $value }} seconds
          labels:
            severity: critical

        - alert: LastFailedArchiveTime
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 5m
          annotations:
            summary: >-
              Archiving failed for {{ $labels.pod }}
          labels:
            severity: critical

        # Backup age is deliberately measured from the barman-cloud plugin's own
        # metric. The in-tree cnpg_collector_last_available_backup_timestamp and
        # the cluster's status.lastSuccessfulBackup both froze on 2026-05-04 when
        # this cluster moved from the in-tree barmanObjectStore method to the
        # plugin, and neither has updated since.
        - alert: PostgresBackupStale
          expr: |-
            (time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)) > 60 * 60 * 26
          for: 30m
          annotations:
            summary: >-
              No successful Postgres backup for over 26 hours; the schedule is daily at 01:00
          labels:
            severity: critical

        - alert: PostgresBackupFailing
          expr: |-
            max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 30m
          annotations:
            summary: >-
              The most recent Postgres backup attempt failed and no later one has succeeded
          labels:
            severity: critical

        - alert: DatabaseDeadlockConflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 5m
          annotations:
            summary: >-
              There are over {{ $value }} deadlock conflicts in {{ $labels.pod }}
          labels:
            severity: critical

        - alert: ReplicaFailingReplication
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 5m
          annotations:
            summary: >-
              Replica {{ $labels.pod }} is failing to replicate
          labels:
            severity: critical
