---
# Replaces spec.monitoring.enablePodMonitor on the postgres Cluster, which is
# deprecated upstream. Name, selector and endpoint match what the operator used
# to generate, so the Prometheus job label stays database/postgres.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
