---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: databasus
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      databasus:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/description: Logical database dumps to the NAS
          glance/icon: mdi:database
          glance/id: databasus
          glance/name: Databasus
          glance/url: https://databasus.omux.io
        initContainers:
          # start.sh writes runtime-config.js into /app/ui/build, which is on the
          # read-only root filesystem. Copy the built UI into an emptyDir so the
          # app can write beside it without dropping readOnlyRootFilesystem.
          copy-ui:
            image:
              repository: docker.io/databasus/databasus
              tag: v3.55.3@sha256:03b1e913fe4c15c933d0a35e85252aee465cb76c0b3d200535d4d8d570b5fa45
            # -r not -a: -a preserves timestamps, which a non-root container cannot
            # set on the emptyDir mount root ("cp: preserving times ... not permitted")
            command: ["sh", "-c", "cp -r /app/ui/build/. /ui-build/"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/databasus/databasus
              tag: v3.55.3@sha256:03b1e913fe4c15c933d0a35e85252aee465cb76c0b3d200535d4d8d570b5fa45
            env:
              TZ: Europe/London
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # The image starts as root, creates the postgres (999) and
              # databasus (65532) trees, chowns them, then drops privileges
              # itself with gosu. These are the capabilities that flow needs.
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
    defaultPodOptions:
      securityContext:
        # Not negotiable for this image: it bundles PostgreSQL and manages two
        # internal users, so it must start as root. It drops to postgres and
        # databasus via gosu. fsGroup is omitted because the app owns the
        # directory permissions itself.
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    persistence:
      # Job definitions, schedules and history. Snapshotted hourly by Kopiur.
      data:
        existingClaim: databasus
        globalMounts:
          - path: /databasus-data
      # The dumps themselves land straight on the NAS rather than on the PVC,
      # so they are not snapshotted twice and TrueNAS owns their retention.
      backups:
        type: nfs
        server: tank.lan
        path: /mnt/tank/backups/databasus
        globalMounts:
          - path: /backups
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      ui-build:
        type: emptyDir
        advancedMounts:
          databasus:
            copy-ui:
              - path: /ui-build
            app:
              - path: /app/ui/build
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.omux.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: &port 4005
    service:
      app:
        ports:
          http:
            port: *port
