---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databasus
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./infrastructure/controllers/database/databasus/app
  postBuild:
    substitute:
      APP: databasus
      KOPIUR_CAPACITY: 5Gi
      # The dumps live on the NAS with TrueNAS owning retention, so the PVC
      # holds only pgdata (postgres-owned, 0700 and unreadable by the mover),
      # instance.json and a log. Nothing worth snapshotting, and snapshotting it
      # would need a namespace-wide privileged mover.
      KOPIUR_SUSPEND: "true"
      # databasus runs as 1000 to match the kopia share ownership, not the 568
      # default, so the mover must follow it or it cannot read the volume.
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
      KOPIUR_MOVER_FSGROUP: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
