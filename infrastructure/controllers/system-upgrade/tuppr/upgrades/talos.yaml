---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.10
  policy:
    rebootMode: powercycle
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: status.ceph.health in ['HEALTH_OK']
    # Kopiur replaced VolSync. Hold the reboot while any snapshot is in flight;
    # Discovered and Succeeded are terminal states and must not block.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: "!(status.phase in ['Pending', 'Running'])"
