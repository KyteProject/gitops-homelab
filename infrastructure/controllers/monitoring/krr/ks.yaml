---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: krr
spec:
  interval: 1h
  path: ./infrastructure/controllers/monitoring/krr/app
  postBuild:
    substitute:
      APP: krr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
