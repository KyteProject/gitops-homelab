---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app krr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      krr:
        enabled: true
        type: job
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: robustadev/krr
              tag: v1.29.0@sha256:76e1dd6f9919aba1ac67afb878e73cb47ad7928d669927d2d9603212175c0963
              pullPolicy: IfNotPresent
            # /bin/sh -c "python krr.py simple --max-workers 3 --width 2048"
            command:
              - python
              - krr.py
              - simple
              - --max-workers
              - "3"
              - --width
              - "2048"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              limits:
                memory: 2Gi
              requests:
                memory: 1Gi

    serviceAccount:
      *app : {}

    rbac:
      roles:
        *app :
          type: ClusterRole
          rules:
            - apiGroups: [ "" ]
              resources:
                - configmaps
                - daemonsets
                - deployments
                - namespaces
                - pods
                - replicasets
                - replicationcontrollers
                - services
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "" ]
              resources: [ "nodes" ]
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "apps" ]
              resources:
                - daemonsets
                - deployments
                - deployments/scale
                - replicasets
                - replicasets/scale
                - statefulsets
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "extensions" ]
              resources:
                - daemonsets
                - deployments
                - deployments/scale
                - ingresses
                - replicasets
                - replicasets/scale
                - replicationcontrollers/scale
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "batch" ]
              resources:
                - cronjobs
                - jobs
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "autoscaling" ]
              resources:
                - horizontalpodautoscalers
              verbs: [ "get", "list", "watch" ]

      bindings:
        *app :
          type: ClusterRoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app
