---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app krr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      # app-template 5.x defaults this to false; this app reads its own
      # ServiceAccount token (it has RBAC bound to it)
      automountServiceAccountToken: true
    controllers:
      krr:
        enabled: true
        type: job
        # A Job's pod template is immutable, so a chart change makes Helm fail
        # with "cannot patch krr with kind Job". Running it as a hook lets Helm
        # delete the previous Job before creating the replacement.
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: robustadev/krr
              tag: v1.30.0@sha256:b8d782e568c7d23aac6460e69dd136e44eca67e8cbfce19915197a48dc28e23f
              pullPolicy: IfNotPresent
            # /bin/sh -c "python krr.py simple --max-workers 3 --width 2048"
            command:
              - python
              - krr.py
              - simple
              - --max-workers
              - "3"
              - --width
              - "2048"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              limits:
                memory: 2Gi
              requests:
                memory: 1Gi

    serviceAccount:
      *app : {}

    rbac:
      roles:
        *app :
          type: ClusterRole
          rules:
            - apiGroups: [ "" ]
              resources:
                - configmaps
                - daemonsets
                - deployments
                - namespaces
                - pods
                - replicasets
                - replicationcontrollers
                - services
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "" ]
              resources: [ "nodes" ]
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "apps" ]
              resources:
                - daemonsets
                - deployments
                - deployments/scale
                - replicasets
                - replicasets/scale
                - statefulsets
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "extensions" ]
              resources:
                - daemonsets
                - deployments
                - deployments/scale
                - ingresses
                - replicasets
                - replicasets/scale
                - replicationcontrollers/scale
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "batch" ]
              resources:
                - cronjobs
                - jobs
              verbs: [ "get", "list", "watch" ]
            - apiGroups: [ "autoscaling" ]
              resources:
                - horizontalpodautoscalers
              verbs: [ "get", "list", "watch" ]

      bindings:
        *app :
          type: ClusterRoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app
