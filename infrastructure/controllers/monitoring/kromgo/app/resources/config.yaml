---
metrics:
  - name: talos_version
    query: label_replace(node_os_info{name="Talos"}, "version_id", "$1",
      "version_id", "v(.+)")
    label: version_id
    title: Talos

  - name: kubernetes_version
    query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version",
      "$1", "git_version", "v(.+)")
    label: git_version
    title: Kubernetes

  - name: flux_version
    query: label_replace(flux_instance_info, "revision", "$1", "revision",
      "v(.+)@sha256:(.+)")
    label: revision
    title: Flux

  - name: cluster_node_count
    query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
    colors:
      - { color: green, min: 0, max: 9999 }
    title: Nodes

  - name: cluster_pod_count
    query: sum(kube_pod_status_phase{phase="Running"})
    colors:
      - { color: green, min: 0, max: 9999 }
    title: Pods

  - name: cluster_cpu_usage
    query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
    suffix: "%"
    colors:
      - { color: green, min: 0, max: 35 }
      - { color: orange, min: 36, max: 75 }
      - { color: red, min: 76, max: 9999 }
    title: CPU

  - name: cluster_memory_usage
    query: round(sum(node_memory_MemTotal_bytes{pod!=""} -
      node_memory_MemAvailable_bytes{pod!=""}) /
      sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
    suffix: "%"
    colors:
      - { color: green, min: 0, max: 35 }
      - { color: orange, min: 36, max: 75 }
      - { color: red, min: 76, max: 9999 }
    title: Memory

  - name: cluster_power_usage
    query: avg(upsAdvOutputActivePower)
    suffix: w
    colors:
      - { color: green, min: 0, max: 500 }
      - { color: orange, min: 501, max: 750 }
      - { color: red, min: 751, max: 9999 }
    title: Power

  - name: cluster_age_days
    query: round((time() - min(kube_node_created) ) / 86400)
    suffix: d
    colors:
      - { color: green, min: 0, max: 180 }
      - { color: orange, min: 181, max: 360 }
      - { color: red, min: 361, max: 9999 }
    title: Age

  - name: cluster_uptime_days
    query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) /
      86400)
    suffix: d
    colors:
      - { color: green, min: 0, max: 180 }
      - { color: orange, min: 181, max: 360 }
      - { color: red, min: 361, max: 9999 }
    title: Uptime

  - name: cluster_alert_count
    query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
    colors:
      - { color: "green", min: 0, max: 0 }
      - { color: "red", min: 1, max: 9999 }
    title: Alerts

  - name: cluster_ceph_health
    query: ceph_health_status
    colors:
      - { color: green, min: 0, max: 0, valueOverride: OK }
      - { color: orange, min: 1, max: 1, valueOverride: WARN }
      - { color: red, min: 2, max: 9999, valueOverride: ERR }
    title: Ceph

  - name: cluster_ceph_usage
    query: round(ceph_cluster_total_used_bytes / ceph_cluster_total_bytes * 100,
      0.1)
    suffix: "%"
    colors:
      - { color: green, min: 0, max: 70 }
      - { color: orange, min: 71, max: 85 }
      - { color: red, min: 86, max: 9999 }
    title: Ceph used

  - name: cluster_ceph_capacity
    query: round(ceph_cluster_total_bytes / 1024 / 1024 / 1024 / 1024, 0.1)
    suffix: TiB
    colors:
      - { color: green, min: 0, max: 9999 }
    title: Ceph capacity

  - name: cluster_ceph_osds_up
    query: count(ceph_osd_up == 1)
    colors:
      - { color: red, min: 0, max: 2 }
      - { color: green, min: 3, max: 9999 }
    title: OSDs up

  # drm-exporter reports a 0 to 1 ratio per engine. The busiest engine is the
  # useful number: a Jellyfin transcode loads video, not render.
  - name: cluster_gpu_usage
    query: round(max(drm_engine_utilization_ratio) * 100, 0.1)
    suffix: "%"
    colors:
      - { color: green, min: 0, max: 35 }
      - { color: orange, min: 36, max: 75 }
      - { color: red, min: 76, max: 9999 }
    title: GPU

  # domain="gpu" is the GPU tile alone. The package domain would include the
  # whole CPU package and read about 16w per node at idle.
  - name: cluster_gpu_power
    query: round(sum(drm_power_watts{domain="gpu"}), 0.1)
    suffix: w
    colors:
      - { color: green, min: 0, max: 30 }
      - { color: orange, min: 31, max: 60 }
      - { color: red, min: 61, max: 9999 }
    title: GPU power
