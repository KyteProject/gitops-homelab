---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: tank.lan
          path: /mnt/tank/kopia
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  parameters:
    epoch:
      # Kopia only compacts index blobs when an epoch closes, and the epoch was
      # held open by the 24h default while eleven hourly policies wrote to it:
      # epochs 93 and 94 accumulated 687 and 1113 uncompacted blobs against a
      # 1000 warning threshold. Closing every 6h keeps a live epoch to a few
      # hundred. advanceOnCount (20) is already exceeded many times over, so
      # duration is the only gate that matters here.
      minDuration: 6h
  moverDefaults:
    cache:
      capacity: 1Mi # Ignored
      mode: Ephemeral
      storageClassName: openebs-hostpath
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    scratch:
      capacity: 1Mi # Ignored
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    ttlSecondsAfterFinished: 300
  scheduleDefaults:
    timezone: Europe/London
