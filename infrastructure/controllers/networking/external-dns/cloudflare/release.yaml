---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    global:
      # the ServiceAccount is created by rbac.yaml and owned by kustomize,
      # so Helm must not try to create and adopt one of the same name
      createDefaultServiceAccount: false
    controllers:
      external-dns-cloudflare:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.k8s.io/external-dns/external-dns
              tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
            args:
              # external-dns v0.22.0 changed the default annotation prefix to
              # external-dns.kubernetes.io/ with no fallback, so every
              # external-dns.alpha.kubernetes.io/ annotation in this repo was
              # silently ignored and policy=sync then deleted the records.
              - --annotation-prefix=external-dns.alpha.kubernetes.io/
              - --cloudflare-dns-records-per-page=1000
              - --cloudflare-proxied
              - --domain-filter=omux.io
              - --events
              - --gateway-name=envoy-external
              - --interval=1m
              - --log-format=text
              - --log-level=info
              - --policy=sync
              - --provider=cloudflare
              - --registry=txt
              - --source=crd
              - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
              - --crd-source-kind=DNSEndpoint
              - --source=gateway-httproute
              - --txt-owner-id=k8s
              - --txt-prefix=k8s.
              - --zone-id-filter=$(CF_ZONE_ID)
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7979
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
        serviceAccount:
          name: external-dns-cloudflare
    defaultPodOptions:
      # app-template 5.x defaults this to false; this app reads its own
      # ServiceAccount token (it has RBAC bound to it)
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
