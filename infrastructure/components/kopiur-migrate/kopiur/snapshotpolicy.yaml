---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  adoption: Adopt
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  mover:
    # The mover must be able to read files the app wrote, so its identity has to
    # match the workload's. Set explicitly rather than inherited from the pod:
    # inheriting silently mints a *privileged* mover for any app running as root
    # (paperless does), which kopiur refuses unless the whole namespace opts in.
    podSecurityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      fsGroup: ${KOPIUR_MOVER_FSGROUP:=1000}
  sources:
    - pvc:
        name: "${APP}"
  verification:
    deep:
      schedule:
        cron: H 5 1 * * # first of the month, 5am
    quick:
      schedule:
        cron: H 3 * * * # daily, 3am
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:=csi-ceph-block}"
