---
# Transitional restore for apps migrating off volsync.
#
# VolSync wrote its kopia snapshots as "${APP}@<namespace>:/data". Kopiur writes
# as "${APP}@<namespace>:/pvc/${APP}" and the path is not overridable, so the
# identities never match and `adoption: Adopt` cannot re-attach them. This reads
# the old identity explicitly for the one-time restore.
#
# Once the app is cut over and kopiur has taken its own snapshot, switch the app
# to components/kopiur. That flips this same Restore to `fromPolicy` in place,
# so the PVC keeps its dataSourceRef and never needs recreating again.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${APP}"
spec:
  credentialProjection:
    enabled: true
  repository:
    kind: ClusterRepository
    name: nas
  source:
    identity:
      username: "${APP}"
      hostname: "${KOPIUR_SRC_HOST}"
      sourcePath: "${KOPIUR_SRC_PATH:=/data}"
      offset: 0
  target:
    populator: {}
