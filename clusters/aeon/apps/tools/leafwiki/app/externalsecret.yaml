---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: leafwiki
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: leafwiki-secret
    template:
      data:
        LEAFWIKI_ADMIN_PASSWORD: "{{ .LEAFWIKI_ADMIN_PASSWORD }}"
        LEAFWIKI_JWT_SECRET: "{{ .LEAFWIKI_JWT_SECRET }}"
  dataFrom:
    - extract:
        key: leafwiki
