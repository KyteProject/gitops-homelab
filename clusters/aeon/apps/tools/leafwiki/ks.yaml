---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: leafwiki
spec:
  components:
    - ../../../../../../infrastructure/components/kopiur
  dependsOn:
    - name: onepassword-connect-store
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/tools/leafwiki/app
  postBuild:
    substitute:
      APP: leafwiki
      KOPIUR_CAPACITY: 2Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
