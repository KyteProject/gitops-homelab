---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docmost
spec:
  components:
    - ../../../../../../infrastructure/components/kopiur
  dependsOn:
    - name: onepassword-connect-store
      namespace: external-secrets
    - name: cloudnative-pg-cluster
      namespace: database
    - name: dragonfly-cluster
      namespace: database
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/tools/docmost/app
  postBuild:
    substitute:
      APP: docmost
      KOPIUR_CAPACITY: 5Gi
      # The image runs as node (1000) and ships /app/data/storage owned by
      # 1000:1000, so the mover has to follow it rather than take the 568 default.
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
      KOPIUR_MOVER_FSGROUP: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
