---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airtrail
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      airtrail:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/description: Flight Tracker
          glance/icon: mdi:airplane
          glance/id: airtrail
          glance/name: AirTrail
          glance/url: https://airtrail.omux.io
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: airtrail-secret
        containers:
          app:
            image:
              # Not ghcr.io/johanohly/airtrail: that path denies anonymous pulls.
              # The project publishes to Docker Hub under johly.
              repository: docker.io/johly/airtrail
              tag: v3.13.0@sha256:b49918c441cd52ffd2ef795738e58031abbcfd1e8094a4365672282bb6b805b1
            env:
              ORIGIN: https://airtrail.omux.io
              TZ: Europe/London
              UPLOAD_LOCATION: /data/uploads
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: airtrail
        globalMounts:
          - path: /data/uploads
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.omux.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: &port 3000
    service:
      app:
        controller: airtrail
        ports:
          http:
            port: *port
