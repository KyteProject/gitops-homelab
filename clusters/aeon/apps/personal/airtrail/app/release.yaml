---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airtrail
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      airtrail:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/description: Flight Tracker
          glance/icon: mdi:airplane
          glance/id: airtrail
          glance/name: AirTrail
          glance/url: https://airtrail.omux.io
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: airtrail-secret
        containers:
          app:
            image:
              # Not ghcr.io/johanohly/airtrail: that path denies anonymous pulls.
              # The project publishes to Docker Hub under johly.
              repository: docker.io/johly/airtrail
              tag: v3.12.0@sha256:c5616704defabd82d2dde97e93a5417e59c7acfdb06c0e589209257543b50f8c
            env:
              ORIGIN: https://airtrail.omux.io
              TZ: Europe/London
              UPLOAD_LOCATION: /data/uploads
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: airtrail
        globalMounts:
          - path: /data/uploads
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.omux.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: &port 3000
    service:
      app:
        controller: airtrail
        ports:
          http:
            port: *port
