---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trek
spec:
  components:
    - ../../../../../../infrastructure/components/kopiur
  dependsOn:
    - name: onepassword-connect-store
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/personal/trek/app
  postBuild:
    substitute:
      APP: trek
      KOPIUR_CAPACITY: 10Gi
      # The image starts as root and chowns its data to node (1000) before
      # dropping to it, so the mover has to match 1000 rather than the 568
      # default. It must not inherit the pod identity either: that would mint a
      # privileged mover, which kopiur refuses.
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
      KOPIUR_MOVER_FSGROUP: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: personal
