---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
spec:
  # components:
  #   - ../../../../../../infrastructure/components/kopiur
  dependsOn:
    - name: immich-db
      namespace: personal
    - name: onepassword-connect-store
      namespace: external-secrets
    - name: openebs
      namespace: storage
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/personal/immich/app
  postBuild:
    substitute:
      APP: immich
      HOSTNAME: photos.omux.io
      APP_UID: "568"
      APP_GID: "568"
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_STORAGECLASS: ceph-filesystem
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: personal
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: onepassword-connect-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/personal/immich/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  timeout: 5m
  wait: true
