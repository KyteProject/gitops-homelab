---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: glance
spec:
  dependsOn:
    - name: onepassword-connect-store
      namespace: external-secrets
  interval: 1h
  path: ./clusters/aeon/apps/personal/glance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: personal
  wait: true
