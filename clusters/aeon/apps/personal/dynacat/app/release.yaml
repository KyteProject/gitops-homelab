---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dynacat
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      # app-template 5.x defaults this to false; the k8s-extension sidecar reads
      # its own ServiceAccount token (it has RBAC bound to it)
      automountServiceAccountToken: true
    controllers:
      dynacat:
        containers:
          app:
            image:
              repository: ghcr.io/panonim/dynacat
              tag: 3.0.0@sha256:974563ad02c190f6a3e1240a096b8927136145956f2c202c17ffbb47d5a9c367
            env:
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: dynacat-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                memory: 128Mi
          k8s-extension:
            image:
              repository: ghcr.io/lukasdietrich/glance-k8s/glance-k8s
              tag: v0.5.6@sha256:428d9a7096dc1e82c1fda46904718991f2b9cef443f7120f74d93df13509eb47
            env:
              TZ: Europe/London
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources: {}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
        serviceAccount:
          identifier: *app
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

    service:
      dynacat:
        controller: dynacat
        ports:
          http:
            port: &port 80
      k8s-extension:
        controller: dynacat
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.omux.io"
          - "dash.omux.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - port: *port
                name: *app
    persistence:
      config-file:
        type: configMap
        name: dynacat-configmap
        advancedMounts:
          dynacat:
            app:
              - path: /app/config/dynacat.yml
                subPath: dynacat.yml
                readOnly: true
      # Dynacat creates its cache directory on startup, which the read-only root
      # filesystem would reject. server.cache-dir points here.
      cache:
        type: emptyDir
        advancedMounts:
          dynacat:
            app:
              - path: /cache
    serviceAccount:
      dynacat:
        enabled: true
    rbac:
      roles:
        list:
          type: ClusterRole
          forceRename: *app
          rules:
            - apiGroups: ["", "metrics.k8s.io"]
              resources: ["nodes"]
              verbs: ["list"]
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["list"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses", "ingressclasses"]
              verbs: ["list"]
            # glance-k8s resolves app links from HTTPRoutes as well as
            # Ingresses. Without this the apps widget renders names with no
            # links, which is what glance does today.
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes"]
              verbs: ["list"]
            - apiGroups: ["apps"]
              resources: ["deployments", "statefulsets", "daemonsets"]
              verbs: ["list"]
      bindings:
        list:
          type: ClusterRoleBinding
          forceRename: *app
          roleRef:
            kind: ClusterRole
            name: *app
          subjects:
            - kind: ServiceAccount
              name: *app
              namespace: "{{ .Release.Namespace }}"
