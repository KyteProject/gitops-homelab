---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dynacat-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    deletionPolicy: Delete
    template:
      data:
        # Read by the currently playing widget. Navidrome authenticates over the
        # Subsonic API, which takes the account password rather than a token.
        JELLYFIN_TOKEN: "{{ .JELLYFIN_TOKEN }}"
        NAVIDROME_USERNAME: "{{ .NAVIDROME_USERNAME }}"
        NAVIDROME_PASSWORD: "{{ .NAVIDROME_PASSWORD }}"
  dataFrom:
    - extract:
        key: dynacat
