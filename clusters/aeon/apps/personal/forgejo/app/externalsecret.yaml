---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-secret
    template:
      data:
        # Key names are fixed by the chart's gitea.admin.existingSecret contract.
        email: "{{ .FORGEJO_ADMIN_EMAIL }}"
        password: "{{ .FORGEJO_ADMIN_PASSWORD }}"
        username: "{{ .FORGEJO_ADMIN_USER }}"
  dataFrom:
    - extract:
        key: forgejo
