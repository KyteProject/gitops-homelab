---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: suwayomi
spec:
  components:
    - ../../../../../../infrastructure/components/kopiur
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/media/suwayomi/app
  postBuild:
    substitute:
      APP: suwayomi
      KOPIUR_CAPACITY: 10Gi
      # The image is USER suwayomi (uid 1000) with its home baked in, so the
      # mover has to match it rather than the 568 default.
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
      KOPIUR_MOVER_FSGROUP: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
