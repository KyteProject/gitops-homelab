---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soulsync
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      soulsync:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/boulderbadgedad/soulsync
              tag: latest@sha256:b0286e772243875e5c6845a27c5dcc984a102db06d797636df41325d11f940a0
            env:
              PGID: "1000"
              PUID: "1000"
              PYTHONPATH: /app
              SOULSYNC_CONFIG_PATH: /app/config/config.json
              TZ: Europe/London
              UMASK: "022"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8008
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    # This image manages its own user: the entrypoint runs groupmod to move its
    # built-in uid/gid onto PUID/PGID, which needs them to already match or it
    # fails with "groupmod: Permission denied" as an unprivileged user. It ships
    # 1000, so 1000 it stays, and KOPIUR_MOVER_* in ks.yaml matches.
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
    # Upstream provisioned two inline PVCs; kopiur templates a single claim
    # named ${APP}, so config and data are subPaths of it.
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          soulsync:
            app:
              - path: /app/config
                subPath: config
              - path: /app/data
                subPath: data
      media:
        type: nfs
        server: tank.lan
        path: /mnt/tank/Media/media
        globalMounts:
          - path: /media
      tmpfs:
        type: emptyDir
        advancedMounts:
          soulsync:
            app:
              - path: /app/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.omux.io"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        ports:
          http:
            port: *port
