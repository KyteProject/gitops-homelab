---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: komf-secret
    template:
      data:
        KOMF_KOMGA_USER: "{{ .KOMF_KOMGA_USER }}"
        KOMF_KOMGA_PASSWORD: "{{ .KOMF_KOMGA_PASSWORD }}"
  dataFrom:
    - extract:
        key: komf
