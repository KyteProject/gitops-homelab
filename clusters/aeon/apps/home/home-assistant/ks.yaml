---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  components:
    - ../../../../../../infrastructure/components/kopiur
  dependsOn:
    - name: multus-networks
      namespace: networking
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./clusters/aeon/apps/home/home-assistant/app
  postBuild:
    substitute:
      APP: home-assistant
      KOPIUR_CAPACITY: 5Gi
      # home-assistant writes .storage/auth as 0600 owned by 568, so the mover
      # must run as 568 to read it. The 1000 default fails with PermissionDenied.
      KOPIUR_MOVER_UID: "568"
      KOPIUR_MOVER_GID: "568"
      KOPIUR_MOVER_FSGROUP: "568"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home
